name: "Zeabur Docker Publish"

on:
  push:
    branches:
      - zeabur-deploy
  workflow_dispatch:
    inputs:
      tag:
        description: "Custom image tag (e.g. v0.19.0-alpha.1)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push runner image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: meta
        run: |
          TAGS="ghcr.io/kartel-engineering/routa:latest"
          TAGS="$TAGS,ghcr.io/kartel-engineering/routa:sha-${GITHUB_SHA::7}"
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAGS="$TAGS,ghcr.io/kartel-engineering/routa:${{ github.event.inputs.tag }}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
