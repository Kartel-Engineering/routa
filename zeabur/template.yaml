# yaml-language-server: $schema=https://schema.zeabur.app/template.json
apiVersion: zeabur.com/v1
kind: Template
metadata:
  name: Routa
spec:
  description: |
    Routa — Multi-agent coordination platform
    Automate, orchestrate, and coordinate AI agents with a kanban-style workflow management system.
  icon: null
  tags:
    - AI
    - Database
  variables:
    - key: APP_DOMAIN
      type: DOMAIN
      name: Application Domain
      description: The domain to bind Routa to
    - key: GITHUB_USER
      type: STRING
      name: GitHub Username
      description: GitHub username for GHCR authentication (e.g. Kartel-Engineering)
    - key: GITHUB_TOKEN
      type: PASSWORD
      name: GitHub PAT
      description: GitHub Personal Access Token with read:packages scope for pulling the private Docker image
  services:
    # ── PostgreSQL Database ──────────────────────────────────────────────
    - name: postgres
      template: PREBUILT_V2
      spec:
        source:
          image: postgres:16-alpine
        ports:
          - id: database
            port: 5432
            type: TCP
        volumes:
          - id: data
            dir: /var/lib/postgresql/data
        env:
          POSTGRES_USER:
            default: routa
            expose: true
          POSTGRES_PASSWORD:
            default: ${PASSWORD}
            expose: true
          POSTGRES_DB:
            default: routa
            expose: true
          POSTGRES_HOST:
            default: ${CONTAINER_HOSTNAME}
            expose: true
          POSTGRES_PORT:
            default: '5432'
            expose: true

    # ── Routa Web Application ────────────────────────────────────────────
    - name: routa
      template: PREBUILT_V2
      domainKey: APP_DOMAIN
      dependencies:
        - postgres
      spec:
        source:
          image: ghcr.io/kartel-engineering/routa:latest
          username: ${GITHUB_USER}
          password: ${GITHUB_TOKEN}
        ports:
          - id: web
            port: 3000
            type: HTTP
        healthCheck:
          type: HTTP
          port: web
          http:
            path: /api/health
        volumes:
          - id: home
            dir: /home/nextjs
        env:
          DATABASE_URL:
            default: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
          ROUTA_DB_DRIVER:
            default: postgres
          NODE_ENV:
            default: production
          PORT:
            default: '3000'
          HOSTNAME:
            default: '0.0.0.0'
          ANTHROPIC_AUTH_TOKEN:
            default: ''
            description: Your Anthropic API key for Claude Code SDK
