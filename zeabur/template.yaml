# yaml-language-server: $schema=https://schema.zeabur.app/template.json
apiVersion: zeabur.com/v1
kind: Template
metadata:
  name: Routa
spec:
  description: |
    Routa — Multi-agent coordination platform
    Automate, orchestrate, and coordinate AI agents with a kanban-style workflow management system.
  icon: null
  tags:
    - AI
    - Database
  variables:
    - key: APP_DOMAIN
      type: DOMAIN
      name: Application Domain
      description: The domain to bind Routa to
  services:
    # ── PostgreSQL Database ──────────────────────────────────────────────
    - name: postgres
      template: PREBUILT_V2
      spec:
        source:
          image: postgres:16-alpine
        ports:
          - id: database
            port: 5432
            type: TCP
        volumes:
          - id: data
            dir: /var/lib/postgresql/data
        env:
          POSTGRES_USER:
            default: routa
            expose: true
          POSTGRES_PASSWORD:
            default: ${PASSWORD}
            expose: true
          POSTGRES_DB:
            default: routa
            expose: true
          POSTGRES_HOST:
            default: ${CONTAINER_HOSTNAME}
            expose: true
          POSTGRES_PORT:
            default: '5432'
            expose: true

    # ── Routa Web Application ────────────────────────────────────────────
    - name: routa
      template: PREBUILT_V2
      domainKey: APP_DOMAIN
      dependencies:
        - postgres
      spec:
        source:
          image: ghcr.io/kartel-engineering/routa:latest
        ports:
          - id: web
            port: 3000
            type: HTTP
        healthCheck:
          type: HTTP
          port: web
          http:
            path: /api/health
        volumes:
          - id: home
            dir: /home/nextjs
        env:
          DATABASE_URL:
            default: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
          ROUTA_DB_DRIVER:
            default: postgres
          NODE_ENV:
            default: production
          PORT:
            default: '3000'
          HOSTNAME:
            default: '0.0.0.0'
          RUN_MIGRATIONS:
            default: 'true'
            description: Run drizzle-kit push on startup
          ANTHROPIC_AUTH_TOKEN:
            default: ''
            description: Your Anthropic API key for Claude Code SDK
          WORKSPACE_AGENT_PROVIDER:
            default: ''
            description: 'LLM provider backend: anthropic | openai | zhipu | minimax'
          OPENAI_API_KEY:
            default: ''
            description: API key for OpenAI-compatible endpoint (Heimdall)
          OPENAI_BASE_URL:
            default: ''
            description: Base URL for OpenAI-compatible endpoint (e.g. https://heimdall.example.com/v1)
          WORKSPACE_AGENT_MODEL:
            default: ''
            description: Model name for workspace agent (e.g. gpt-4o)
